version: '3.8'
services:
  db:
    container_name: pg_container
    image: postgres:alpine3.19
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - 5432:5432
    volumes:
      - local_pgdata:/var/lib/postgresql/data
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  local_pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/dev/project/docker_data/pg_data
  pgadmin-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/dev/project/docker_data/pgAdmin_data
